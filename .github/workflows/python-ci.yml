name: python-ci

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python-ci.yml"]

defaults:
  run:
    working-directory: python

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the supported floor and a current version.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Unit tests (+ coverage + JUnit report)
        # Integration tests are marked `integration` and deselected here (see pyproject addopts).
        run: |
          mkdir -p reports
          pytest tests/ -q \
            --cov=pylakekeeper --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit-unit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: python/reports/

  package:
    # Guards the distribution itself, not the code. 0.1.0 and 0.3.0 both shipped an sdist
    # containing `../README.md` — a member escaping the archive root — which pip refuses to
    # unpack, so every source install and every piwheels build failed while the wheel
    # looked fine. Only an actual install *from the sdist* catches that.
    name: Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Reject sdist members outside the archive root
        run: |
          bad=$(tar tzf dist/*.tar.gz | grep -E '^/|(^|/)\.\./' || true)
          if [ -n "$bad" ]; then
            echo "::error::sdist contains paths escaping the archive root:"
            echo "$bad"
            exit 1
          fi
          echo "sdist paths OK"

      - name: Validate metadata rendering
        run: twine check --strict dist/*

      - name: Install from the sdist and import
        # --no-binary pylakekeeper forces the sdist path; deps still use wheels.
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --no-cache-dir --no-binary pylakekeeper dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import pylakekeeper; print(pylakekeeper.Client)"

      - name: Install from the wheel and import
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-cache-dir dist/*.whl
          /tmp/wheel-venv/bin/python -c "import pylakekeeper; print(pylakekeeper.Client)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  integration:
    # Full stack (Lakekeeper + Postgres + MinIO + Keycloak) via docker compose, real OAuth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Integration tests (+ JUnit report)
        # ubuntu-latest ships docker + compose v2; conftest auto-detects the `docker` binary.
        run: |
          mkdir -p reports
          pytest tests/integration -m integration -q --junitxml=reports/junit-integration.xml
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-integration
          path: python/reports/
